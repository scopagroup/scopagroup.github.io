title: "SCOPA"
description: "SCOPA — Scientific Computing, Optimization & Parallel Algorithms Lab"
lang: en

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# organization site settings
url: "https://scopagroup.github.io"
baseurl: ""

# jekyll-seo-tag resolves the author from page.author, then site.author,
# so this site-level key is picked up on every page.
author: "Andreas Mang"

# The card image is NOT resolved that way: jekyll-seo-tag's ImageDrop reads
# page["image"] only and has no site.image fallback, so a top-level `image:`
# key is silently ignored. Setting it as a front-matter default puts it on
# every page, which is what the plugin actually reads.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/social-card.png
        width: 1200
        height: 630
        alt: "SCOPA - Scientific Computing, Optimization & Parallel Algorithms"
